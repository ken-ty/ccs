# ドキュメントをビルドして GitHub Pages へ出す。
#
# リポジトリを public にした（2026-08-22）ので、Artifacts に上げるだけだった
# 前提が消えた。**Artifacts は URL で読めない** ── zip を落として展開して
# index.html を開くしかなく、他人に渡せるものにならない。
#
# 公開先: https://ken-ty.github.io/ccs/

name: docs

on:
  push:
    branches: [main]
    # 以前は pull_request 側でもこの paths を参照していた（*docs_paths）。
    # PR 側で回すのをやめたので、参照は push だけになった。
    # hooks/pre-push はこのリストと同じパスを見て docs のビルドを回すか決める。
    paths: &docs_paths
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/termshot.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# **cancel-in-progress: false。** デプロイするワークフローなので、途中で切ると
# 公開されているサイトが中途半端な状態で止まりうる。group も ref ではなく
# pages 固定にする ── デプロイ先が 1 つしか無いため。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 書かないと既定 360 分。2026-08 の実測は 14 run すべて 0.4 分以内
    # （平均 0.29 分）なので、pip が遅い日を見込んでも 5 分あれば足りる。
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存を入れる（版は requirements-docs.txt で固定）
        run: pip install -r requirements-docs.txt

      - name: ビルド
        # --strict にして、リンク切れや未参照ファイルで落とす。
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
