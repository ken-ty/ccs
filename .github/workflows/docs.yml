# ドキュメントをビルドして Artifacts に上げる。
#
# **GitHub Pages へはデプロイしない。** このリポジトリは private で、Free プランでは
# private リポジトリの Pages を publish できない。仮にできても Pages のサイトは
# インターネットに公開される。Artifacts なら**リポジトリのアクセス権がそのまま
# ドキュメントのアクセス制御になる**。
#
# 公開に切り替えるなら、可視性の変更（人間の判断）と合わせてここも書き換える。

name: docs

on:
  push:
    branches: [main]
    # 以前は pull_request 側でもこの paths を参照していた（*docs_paths）。
    # PR 側で回すのをやめたので、参照は push だけになった。
    # hooks/pre-push はこのリストと同じパスを見て docs のビルドを回すか決める。
    paths: &docs_paths
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/termshot.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Artifacts に上げるだけでどこにも publish しないので、途中で切っても
# 中途半端に反映されることはない。cancel-in-progress: true でよい。
# （デプロイするワークフローなら false にすること）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 書かないと既定 360 分。2026-08 の実測は 14 run すべて 0.4 分以内
    # （平均 0.29 分）なので、pip が遅い日を見込んでも 5 分あれば足りる。
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存を入れる（版は requirements-docs.txt で固定）
        run: pip install -r requirements-docs.txt

      - name: ビルド
        # --strict にして、リンク切れや未参照ファイルで落とす。
        run: mkdocs build --strict

      - uses: actions/upload-artifact@v4
        with:
          name: ccs-docs
          path: site/
          retention-days: 14
