# shellcheck と bats をかける。
#
# **integration テストも CI で走る。** 本物の claude を起動しないので
# （test/fixtures/fake-claude を使う）、API キーもログインも要らない。
# ここが本物を起動する作りになったら、CI は課金され、ログイン状態に依存し、
# 実行のたびに結果が変わる ── そうなっていないことの番人がこのワークフロー。

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 依存を入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux jq bats

      # **shellcheck はバージョンを固定する。** apt の版 (0.9.x) は手元の
      # brew 版 (0.11.x) と検出する項目が違い、「ローカルでは通るのに CI で
      # 落ちる」を生む。実際に SC2015 で 1 度踏んだ。どちらかに揃える以外に
      # 直しようがないので、明示的に固定する。
      - name: shellcheck を固定バージョンで入れる
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      - name: バージョンを記録する
        # 落ちたときに、どの版で落ちたかを追えるようにしておく。
        run: |
          shellcheck --version | head -3
          bats --version
          tmux -V
          jq --version

      - name: lint
        run: make lint

      - name: test
        run: make test

      - name: 本物の claude を起動していないことを確かめる
        # 保険。CI ランナーに claude は入っていないので、もし
        # テストが本物を呼んでいれば、この時点より前に落ちているはず。
        run: |
          if command -v claude >/dev/null 2>&1; then
            echo '::error::CI ランナーに claude が存在します。テストが本物を起動しうるので確認してください'
            exit 1
          fi
          echo 'ok: claude は存在しない'
