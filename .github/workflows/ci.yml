# shellcheck と bats をかける。
#
# **integration テストも CI で走る。** 本物の claude を起動しないので
# （test/fixtures/fake-claude を使う）、API キーもログインも要らない。
# ここが本物を起動する作りになったら、CI は課金され、ログイン状態に依存し、
# 実行のたびに結果が変わる ── そうなっていないことの番人がこのワークフロー。
#
# ## PR 側では回さない
#
# 検証は push 前に手元で終わっている前提を取る。担保は `hooks/pre-push` で、
# `make check` を回して落ちたら push させない（`make setup-hooks` で有効になる）。
#
# 以前は `pull_request` でも回していた。やめた理由は 2 つ。
#
# 1. **PR のチェックは元々「関門」ではなかった。** このリポジトリは Free プランの
#    private なので branch protection が使えず（/branches/main/protection は
#    403 "Upgrade to GitHub Pro or make this repository public"）、required check
#    にできない。赤くてもマージボタンは押せる状態だった
# 2. **PR と main への push が数分差で対になっており、同じ内容を 2 回検証していた**
#
# 2026-08 の実測では、PR 側の実行だけで 29 分/月を使っていた。
# → ken-ty/cost-management#11
#
# ## ただし、下の「本物の claude を起動していないことを確かめる」だけは
# ## 手元で再現できない
#
# あのステップは **ランナーに claude が入っていないこと**を利用した保険で、
# claude が入っている開発機では意味を持たない。**ここだけは main への push で
# しか検証されない。** テストが本物を起動する作りに変わってしまった場合、
# 気づくのはマージ後になる。それを承知でこの形にしている。
#
# 手元は macOS + bash 3.2、ここは ubuntu + bash 5.x。shellcheck は手元も CI も
# 0.11.0 で揃えてあるが、bash と coreutils の差は残る。
# **main で落ちたら revert せず fix-forward で直す。**

name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同じ ref で新しい run が来たら、古い方を打ち切る。
# 連続 push で無駄に走り続けるのを止めるためだが、効くのはむしろ事故のとき ──
# 1 本目がハングしたまま生きていると、後続の push が 2 本目を起こして
# **同じ穴に落ちる**。2026-08-18 の事故は実際これで被害が 2 倍になった。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # **これが無いと既定の 360 分が適用される。** 2026-08-18 に ci.yml が
    # 2 回ハングし、通常 1.1 分の仕事が 361 分ずつ、計 723 分課金された
    # （2026-08 の総消費 1,930 分の 37.5%）。
    # 通常 33 run の実時間は平均 1.10 分 / 最大 1.92 分なので、その約 5 倍。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 依存を入れる
        # ハングしたのはここ。両 run とも apt-get update が
        # `Get:5 https://archive.ubuntu.com/ubuntu noble-security InRelease`
        # を最後に 6 時間無出力になった（install は開始すらしていない）。
        # 直前に azure.archive.ubuntu.com が Ign され archive.ubuntu.com へ
        # フォールバックしており、ミラー側の一時障害と見てよい。
        #
        # 対策は 2 段構え。**止まることを保証するのは step の timeout-minutes** で、
        # apt のオプションは補助。https 取得の途中での無応答に
        # Acquire::https::Timeout が効くはずだが、今回の停止パターンで実際に
        # 効くところまでは検証できていないため、これ単独には頼らない。
        timeout-minutes: 3
        run: |
          sudo apt-get -o Acquire::Retries=3 \
                       -o Acquire::http::Timeout=15 \
                       -o Acquire::https::Timeout=15 update
          sudo apt-get install -y --no-install-recommends tmux jq bats

      # **shellcheck はバージョンを固定する。** apt の版 (0.9.x) は手元の
      # brew 版 (0.11.x) と検出する項目が違い、「ローカルでは通るのに CI で
      # 落ちる」を生む。実際に SC2015 で 1 度踏んだ。どちらかに揃える以外に
      # 直しようがないので、明示的に固定する。
      - name: shellcheck を固定バージョンで入れる
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      - name: バージョンを記録する
        # 落ちたときに、どの版で落ちたかを追えるようにしておく。
        run: |
          shellcheck --version | head -3
          bats --version
          tmux -V
          jq --version

      - name: lint
        run: make lint

      - name: test
        run: make test

      - name: 本物の claude を起動していないことを確かめる
        # 保険。CI ランナーに claude は入っていないので、もし
        # テストが本物を呼んでいれば、この時点より前に落ちているはず。
        run: |
          if command -v claude >/dev/null 2>&1; then
            echo '::error::CI ランナーに claude が存在します。テストが本物を起動しうるので確認してください'
            exit 1
          fi
          echo 'ok: claude は存在しない'
