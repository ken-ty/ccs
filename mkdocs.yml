# ccs のドキュメント。
#
# **GitHub Pages へは出さない。** このリポジトリは private で、Free プランでは
# private リポジトリの Pages を publish できない。仮にできてもサイト自体は
# 公開されてしまう。CI では Artifacts に上げる ── そうすればリポジトリの
# アクセス権がそのままドキュメントのアクセス制御になる。
#
# 手元で読むときは `make docs`（uvx 経由なので事前の pip install は要らない）。

site_name: ccs
site_description: Claude Code セッションを tmux で立てる薄いラッパー

# 生成物からリポジトリの該当行へは飛ばせないので、編集リンクは出さない。
edit_uri: ''

theme:
  name: material
  language: ja
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      # 既定の slugify は非 ASCII を落とすので、日本語の見出しが
      # すべて `#2` のような番号だけの id になり、GitHub 上のリンクと
      # 食い違う。同じ文書を GitHub でも site でも読むので、揃える。
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - はじめに: index.md
  - なぜ要るのか: why.md
  - 使い方:
      - はじめてのセッション: tutorial.md
      - 手を動かして確かめる: hands-on.md
      - ハブの組み込みツール: agent-tools.md
  - 設計:
      - 設計調査: design.md
      - 参照資料: references.md
