# ccs のドキュメント。
#
# **GitHub Pages へ出す**（2026-08-22、リポジトリを public にしたのに合わせて）。
# 以前は Artifacts に上げるだけだったが、あれは URL で読めない ── zip を落として
# 展開して index.html を開くしかなく、他人に渡せるものにならなかった。
# デプロイは .github/workflows/docs.yml。
#
# 手元で読むときは `make docs`（uvx 経由なので事前の pip install は要らない）。

site_name: ccs
site_description: Claude Code セッションを tmux で立てる薄いラッパー
site_url: https://ken-ty.github.io/ccs/

# ヘッダから GitHub へ飛べるようにする。public にしたので出して困らない。
repo_url: https://github.com/ken-ty/ccs
repo_name: ken-ty/ccs

# 生成物からリポジトリの該当行へは飛ばせないので、編集リンクは出さない。
edit_uri: ''

theme:
  name: material
  language: ja
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      # 既定の slugify は非 ASCII を落とすので、日本語の見出しが
      # すべて `#2` のような番号だけの id になり、GitHub 上のリンクと
      # 食い違う。同じ文書を GitHub でも site でも読むので、揃える。
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - はじめに: index.md
  - なぜ要るのか: why.md
  - 使い方:
      - はじめてのセッション: tutorial.md
      - 手を動かして確かめる: hands-on.md
      - ハブの組み込みツール: agent-tools.md
  - 運用:
      - hub を常時立てる: hub.md
      - 盤面を 1 コマンドで取る: board.md
      - 止まったセッションを戻す: restore.md
      - 設定: configuration.md
  - 設計:
      - 設計調査: design.md
      - スマホから端末を触る: mobile-terminal.md
      - 参照資料: references.md
  - 決定記録 (ADR):
      - ADR とは: adr/README.md
      - 'ADR-0001: 使い捨て作業枠の同一性': adr/0001-scratch-workspace-identity.md
      - 'ADR-0002: セッションの同一性': adr/0002-session-identity.md
      - 'ADR-0003: worktree の置き場所': adr/0003-worktree-under-repo.md
